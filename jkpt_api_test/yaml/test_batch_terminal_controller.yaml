# yaml/test_batch_terminal_controller.yaml
# 设备批量管理接口 (Terminal Batch Controller) — 8 个接口
# 执行顺序依赖 test_batch_terminal_controller.py 中方法名前缀 a→h

batch_import_cases:
  - name: "批量导入设备-正向"
    scenario: "positive"
    file_key: "template"
    expected:
      code: 0
      error_msg: "成功"

  - name: "批量导入设备-负向-未上传文件"
    scenario: "no_file"
    expected:
      code: 999
      error_msg: "失败"

  - name: "批量导入设备-负向-空文件"
    scenario: "empty_file"
    expected:
      code: 1001
      error_msg: "文件不能为空"

batch_details_cases:
  - name: "批量查询详情-正向"
    addrs: "{{batch_addrs}}"
    expected:
      code: 0
      error_msg: "成功"

  - name: "批量查询详情-负向-addrs为空"
    addrs: ""
    expected:
      code: 1001
      error_msg: "设备地址不能为空"


batch_remark_cases:
  - name: "批量查询备注-正向"
    addrs: "{{batch_addrs}}"
    expected:
      code: 0
      error_msg: "成功"

  - name: "批量查询备注-负向-addrs为空"
    addrs: ""
    expected:
      code: 1001
      error_msg: "设备地址不能为空"


batch_aggr_point_cases:
  - name: "聚合点批量查询详情-正向"
    addrs: "{{batch_addrs}}"
    page: 1
    pageSize: 100
    expected:
      code: 0
      error_msg: "成功"

  - name: "聚合点批量查询详情-负向-addrs为空"
    addrs: ""
    page: 1
    pageSize: 100
    expected:
      code: 1001
      error_msg: "聚合点设备地址不能为空"


batch_lnglat_cases:
  - name: "经纬度批量查询详情-正向"
    addr: ""
    points:
      - lat: 22.543096
        lng: 114.057868
      - lat: 32.129163
        lng: 123.264435
      - lat: 24.543096
        lng: 116.057868
    page: 1
    pageSize: 100
    expected:
      code: 0
      error_msg: "成功"

  - name: "经纬度批量查询详情-负向-points为空"
    addr: ""
    points: []
    page: 1
    pageSize: 100
    expected:
      code: 1001
      error_msg: "经纬度点列表不能为空"

batch_move_group_cases:
  - name: "批量移动分组-正向"
    addrs: "{{batch_addrs}}"
    newGroupId: "{{one_id}}"
    expected:
      code: 0
      error_msg: "成功"

  - name: "批量移动分组-负向-目标分组不存在"
    addrs: "{{batch_addrs}}"
    newGroupId: "NONEXIST_GROUP_ID"
    expected:
      code: 3003
      error_msg: "分组不存在"

  - name: "批量移动分组-负向-addrs为空"
    addrs: ""
    newGroupId: "{{one_id}}"
    expected:
      code: 1001
      error_msg: "设备地址不能为空"

batch_export_cases:
  - name: "批量导出设备-正向"
    addrs: "{{batch_addrs}}"
    binary_response: true
    expected:
      http_status: 200
      filename: terminalInfo.xlsx
      headers:
        - "状态"
        - "设备卡号"
        - "备注名称"
        - "设备类型"
        - "最后通信时间"
        - "最后定位时间"
        - "设备分组"
        - "运行状态信息"
        - "自定义字段"
      addr_column: "设备卡号"

  
  - name: "批量导出设备-负向-addrs为空"
    addrs: ""
    expected:
      http_status: 200

batch_delete_cases:
  - name: "批量解绑设备-正向"
    addrs: "{{batch_addrs}}"
    expected:
      code: 0
      error_msg: "成功"

  - name: "批量解绑设备-负向-addrs为空"
    addrs: ""
    expected:
      code: 1001
      error_msg: "设备地址不能为空"
