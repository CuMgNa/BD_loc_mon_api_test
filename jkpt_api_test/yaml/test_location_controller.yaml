# yaml/test_location_controller.yaml
# 位置管理接口：分页列表、轨迹、导出
# addr 占位 {{bd_test_terminal}} 由 test_location_controller.py 解析
# startTimeStr/endTimeStr 省略时由代码按 Asia/Shanghai 当天 00:00:00–23:59:59 注入

location_list_cases:
  - name: "分页查询位置列表-正向"
    scenario: "positive"
    addr: "{{bd_test_terminal}}"
    page: 1
    pageSize: 10
    expected:
      code: 0
      msg: "成功"

  - name: "分页查询位置列表-负向-addr为空"
    scenario: "empty_addr"
    addr: ""
    page: 1
    pageSize: 10
    expected:
      code: 999
      error_msg: "失败"

  - name: "分页查询位置列表-负向-未授权"
    scenario: "no_auth"
    addr: "{{bd_test_terminal}}"
    page: 1
    pageSize: 10
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

location_track_cases:
  - name: "获取轨迹信息-正向"
    scenario: "positive"
    addr: "{{bd_test_terminal}}"
    expected:
      code: 0
      msg: "成功"

  - name: "获取轨迹信息-负向-addr为空"
    scenario: "empty_addr"
    addr: ""
    expected:
      code: 999
      error_msg: "无此设备数据信息"

location_export_cases:
  - name: "导出轨迹信息-正向"
    scenario: "positive"
    addr: "{{bd_test_terminal}}"
    binary_response: true
    expected:
      http_status: 200
      code: 999
      error_msg: "失败"

  - name: "导出轨迹信息-负向-addr为空"
    scenario: "empty_addr"
    addr: ""
    expected:
      code: 999
      error_msg: "无此设备数据信息"
