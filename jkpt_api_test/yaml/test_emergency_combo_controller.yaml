# yaml/test_emergency_combo_controller.yaml
# 应急套餐商城：combo_mall_id / combo_mall_price 仅第一条「带 TT_RESCUE_STICK 且日包非空」的 mall 正向同次写入
# emergency_user_combo_id / emergency_user_combo_addr 仅「我的套餐-正向-无过滤」写入（优先 status=1 激活时间最晚）
# {{rescue_sat_terminal}} 由 testcase 经 _EcmHelpers 注入 fixture，不走 extract
# {{combo_mall_id}} / {{emergency_user_combo_id}} 整段占位才 resolve_extract_value；负向 case 一律字面量，禁占位符
# combo_order_no 只写不读
# 负向码来自 2026-08-18 现网探针（header 即可；buy 连续下单会 999 过于频繁，buy 负向放正向前）

emergency_combo_mall_cases:
  - name: "套餐商城-列表-正向-COMBINATION-救援棒"
    packageType: "COMBINATION"
    terminalType: "TT_RESCUE_STICK"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-列表-正向-POSITION-救援棒"
    packageType: "POSITION"
    terminalType: "TT_RESCUE_STICK"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-列表-正向-SHORT_MESSAGE-救援棒"
    packageType: "SHORT_MESSAGE"
    terminalType: "TT_RESCUE_STICK"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-列表-正向-不带终端类型"
    packageType: "COMBINATION"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-列表-负向-缺packageType"
    terminalType: "TT_RESCUE_STICK"
    expected:
      code: 1001
      error_msg: "请检查请求参数是否正确"

  - name: "套餐商城-列表-负向-packageType非法"
    packageType: "FOO"
    terminalType: "TT_RESCUE_STICK"
    expected:
      code: 1001
      error_msg: "未知参数错误"

  - name: "套餐商城-列表-负向-缺token"
    packageType: "COMBINATION"
    terminalType: "TT_RESCUE_STICK"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

emergency_combo_info_cases:
  - name: "套餐商城-我的套餐-正向-无过滤"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-我的套餐-正向-按救援棒addr"
    addr: "{{rescue_sat_terminal}}"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-我的套餐-正向-status未付款"
    status: 0
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-我的套餐-正向-status使用中"
    status: 1
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-我的套餐-正向-status已过期"
    status: 2
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-我的套餐-负向-缺token"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

emergency_combo_remaining_cases:
  - name: "套餐商城-余量-正向-仅救援棒addr"
    addr: "{{rescue_sat_terminal}}"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-余量-负向-缺addr"
    expected:
      code: 1001
      error_msg: "请检查请求参数是否正确"

  - name: "套餐商城-余量-负向-addr不存在"
    addr: "000000000000"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-余量-负向-缺token"
    addr: "{{rescue_sat_terminal}}"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

emergency_combo_usage_page_cases:
  - name: "套餐商城-用量分页-负向-无过滤参数"
    expected:
      code: 1001
      error_msg: "参数无效"

  - name: "套餐商城-用量分页-正向-按救援棒addr"
    addr: "{{rescue_sat_terminal}}"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-用量分页-正向-按emergencyUserComboId"
    emergencyUserComboId: "{{emergency_user_combo_id}}"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-用量分页-边界-page=0"
    addr: "{{rescue_sat_terminal}}"
    page: 0
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-用量分页-边界-pageSize极大"
    addr: "{{rescue_sat_terminal}}"
    page: 1
    pageSize: 10000
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-用量分页-边界-page=-1"
    addr: "{{rescue_sat_terminal}}"
    page: -1
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-用量分页-边界-pageSize=0"
    addr: "{{rescue_sat_terminal}}"
    page: 1
    pageSize: 0
    expected:
      code: 999
      error_msg: "失败"

  - name: "套餐商城-用量分页-正向-假emergencyUserComboId仍空页"
    emergencyUserComboId: 0
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-用量分页-负向-缺token"
    addr: "{{rescue_sat_terminal}}"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

emergency_combo_buy_cases:
  # 正向先跑。其后带真实 addrs 的负向会被「下单过于频繁」污染，故不做假 comboId/假 addr/错类型。
  # 缺 addrs / [] 走参数校验，成功下单后仍是 1001。
  - name: "套餐商城-订购-正向-待支付订单"
    addrs:
      - "{{rescue_sat_terminal}}"
    emergencyComboId: "{{combo_mall_id}}"
    terminalType: "TT_RESCUE_STICK"
    expected:
      code: 0
      msg: "成功"

  - name: "套餐商城-订购-负向-缺token"
    addrs:
      - "{{rescue_sat_terminal}}"
    emergencyComboId: 0
    terminalType: "TT_RESCUE_STICK"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

  - name: "套餐商城-订购-负向-不传addrs"
    emergencyComboId: 0
    terminalType: "TT_RESCUE_STICK"
    expected:
      code: 1001
      error_msg: "地址不能为空"

  - name: "套餐商城-订购-负向-addrs空数组"
    addrs: []
    emergencyComboId: 0
    terminalType: "TT_RESCUE_STICK"
    expected:
      code: 1001
      error_msg: "地址不能为空"
