# yaml/test_login.yaml
login_cases:
  - name: "账号为空"
    account: ""
    password: "4f9cb165cd6249312e5804fcf9416c5e"
    captcha: "test"
    captchaId: "123456789012345678"
    expected:
      code: 1001
      error_msg: "帐号不能为空"

  - name: "密码为空"
    account: "tmn"
    password: ""
    captcha: "test"
    captchaId: "123456789012345678"
    expected:
      code: 1001
      error_msg: "密码不能为空"

  - name: "验证码错误"
    account: "tmn"
    password: "4f9cb165cd6249312e5804fcf9416c5e"
    captcha: "wrong"
    captchaId: "123456789012345678"
    expected:
      code: 999
      error_msg: "验证码错误"

  - name: "账号不存在"
    account: "nonexist"
    password: "4f9cb165cd6249312e5804fcf9416c5e"
    captcha: "test"
    captchaId: "123456789012345678"
    expected:
      code: 1001
      error_msg: "账号不存在"