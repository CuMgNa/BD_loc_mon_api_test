# yaml/test_emergency_chat_controller.yaml
# 求救群聊接口 (Emergency Chat Controller) — 13 个接口
# 造数链：rescue_sat_terminal → emergency_chat_item（conftest fixture，SOS上行自动建群）
# 数据通道：extract.yaml {{emergency_chat_item_id}} / {{emergency_chat_sn}} / {{emergency_chat_item_name}}

# ---------- 1. item/page 群聊列表 ----------
item_page_cases:
  - name: "群聊列表-正向-默认分页"
    scenario: "positive"
    page: 1
    page_size: 10
    expected:
      code: 0
      msg: "成功"

  - name: "群聊列表-正向-按卡号模糊查询"
    scenario: "positive"
    item_name: "{{emergency_chat_sn}}"
    page: 1
    page_size: 10
    expected:
      code: 0
      msg: "成功"

  - name: "群聊列表-负向-缺token"
    scenario: "no_auth"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

  - name: "群聊列表-边界-page=0"
    scenario: "positive"
    page: 0
    page_size: 10
    expected:
      code: 0
      msg: "成功"

  - name: "群聊列表-边界-pageSize极大"
    scenario: "positive"
    page: 1
    page_size: 1000
    expected:
      code: 0
      msg: "成功"


# ---------- 2. member/list 成员查询 ----------
member_list_cases:
  - name: "成员列表-正向"
    scenario: "positive"
    chat_item_id: "{{emergency_chat_item_id}}"
    expected:
      code: 0
      msg: "成功"

  - name: "成员列表-负向-chatItemId不存在"
    scenario: "positive"
    chat_item_id: "nonexist_chat_item_id_999"
    expected:
      code: 0
      msg: "成功"

  - name: "成员列表-负向-chatItemId为空"
    scenario: "positive"
    chat_item_id: ""
    # 2026-08-14 实测：接口对空 chatItemId 不校验，返回成功——疑似健壮性缺陷，记录待开发确认
    expected:
      code: 0
      msg: "成功"

  - name: "成员列表-负向-缺token"
    scenario: "no_auth"
    chat_item_id: "{{emergency_chat_item_id}}"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"


