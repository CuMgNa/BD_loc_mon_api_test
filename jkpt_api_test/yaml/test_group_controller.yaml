# yaml/test_group_controller.yaml
# 分组管理接口测试数据 (Group Controller)
# 覆盖: 分组增删改查、分组勾选/展开/排序

add_group_l1_cases:
  - name: "添加分组-一级分组-正向"
    groupName: "AUTO_GROUP_L11"
    parentId: 0
    expected:
      code: 0
      msg: "成功"

  - name: "添加分组-一级分组-负向-名称为空"
    groupName: ""
    parentId: 0
    expected:
      code: 1001
      error_msg: "分组名称不能为空"
  
  - name: "添加分组-一级分组-负向-分组名称大于20"
    groupName: "这是一个非常非常非常长的名称超出限制长度了..."
    parentId: 0
    expected:
      code: 1001
      error_msg: "分组名称不能超过20个字符"

add_group_l2_cases:
  - name: "添加分组-二级分组-正向"
    groupName: "AUTO_GROUP_L22"
    parentId: "{{one_id}}"
    expected:
      code: 0
      msg: "成功"

  - name: "添加分组-二级分组-负向-名称为空"
    groupName: ""
    parentId: "{{one_id}}"
    expected:
      code: 1001
      error_msg: "分组名称不能为空"


  - name: "添加分组-二级分组-负向-分组名称大于20"
    groupName: "这是一个非常非常非常长的名称超出限制长度了..."
    parentId: "{{one_id}}"
    expected:
      code: 1001
      error_msg: "分组名称不能超过20个字符"

add_group_l3_cases:
  - name: "添加分组-三级分组-正向"
    groupName: "AUTO_GROUP_L33"
    parentId: "{{two_id}}"
    expected:
      code: 0
      msg: "成功"

  - name: "添加分组-三级分组-负向-名称为空"
    groupName: ""
    parentId: "{{two_id}}"
    expected:
      code: 1001
      error_msg: "分组名称不能为空"

get_groups_cases:
  - name: "获取设备分组信息-正向"
    expected:
      code: 0
      msg: "成功"

  - name: "获取设备分组信息-负向-缺少Token"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"

update_group_cases:
  - name: "编辑分组名称-正向"
    groupId: "{{one_id}}"
    groupName: "Updated_{int(time.time())}"
    expected:
      code: 0
      msg: "成功"

  - name: "编辑分组名称-负向-分组名称为空"
    groupId: "{{one_id}}"
    groupName: ""
    expected:
      code: 1001
      error_msg: "分组名称不能为空"

sort_groups_cases:
  - name: "分组排序-正向"
    groupIds: "{{parent_group_ids}}"
    expected:
      code: 0
      msg: "成功"
  
  - name: "分组排序-负向-分组ID为空"
    groupIds: ""
    expected:
      code: 1001
      error_msg: "分组ID不能为空"

delete_group_cases:

  - name: "删除三级分组-正向"
    groupId: "{{three_id}}"
    expected:
      code: 0
      msg: "成功"

  - name: "删除二级分组-正向"
    groupId: "{{two_id}}"
    expected:
      code: 0
      msg: "成功"
  
  - name: "删除一级分组-正向"
    groupId: "{{one_id}}"
    expected:
      code: 0
      msg: "成功"

  - name: "删除分组-负向-分组不存在"
    groupId: "TEST_NONEXIST_ID"
    expected:
      code: 999
      error_msg: "失败"

