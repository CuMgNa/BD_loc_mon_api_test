# yaml/test_terminal_controller.yaml
# 设备管理接口测试数据 (Terminal Controller)
# 覆盖: 设备增删改查、设备批量导入、设备移动、设备收藏等

add_terminal_cases:
  - name: "三级分组添加单个设备-正向"
    groupId: "{{three_id}}"
    addr: ""
    remark: "测试设备"
    useScope: "ANIMAL"
    sn: "20260430200103"
    password: ""
    trackColor: "#141323"
    trackSize: 5
    gatewayParam:
      colorCodeId: 1
      gid: 0
      radioRcvChn: ""
      radioSndChn: ""
      radioPower: 0
      rxCss: ""
      txCss: ""
      width: 0
    fieldJson: ""
    fields:
      - name: "自定义字段1"
        value: "自定义值1"
      - name: "自定义字段2"
        value: "自定义值2"
    expected:
      code: 0
      error_msg: "成功"

  - name: "添加单个设备-负向-SN为空"
    groupId: "{{three_id}}"
    addr: ""
    remark: "测试设备"
    useScope: "ANIMAL"
    sn: ""
    password: ""
    trackColor: "#141323"
    trackSize: 5
    gatewayParam:
      colorCodeId: 1
      gid: 0
      radioRcvChn: ""
      radioSndChn: ""
      radioPower: 0
      rxCss: ""
      txCss: ""
      width: 0
    fieldJson: ""
    fields: []
    expected:
      code: 1001
      error_msg: "设备SN不能为空"

update_terminal_cases:
  - name: "编辑设备-正向"
    groupId: "{{three_id}}"
    remark: "更新后的备注"
    useScope: "ANIMAL"
    sn: ""
    password: ""
    trackColor: "#141323"
    trackSize: 5
    gatewayParam:
      colorCodeId: 1
      gid: 0
      radioRcvChn: ""
      radioSndChn: ""
      radioPower: 0
      rxCss: ""
      txCss: ""
      width: 0
    fieldJson: ""
    fields: []
    expected:
      code: 0
      error_msg: "成功"

batch_add_terminals_cases:
  - name: "手动输入SN码批量添加-正向"
    groupId: "{{two_id}}"
    useScope: "TRAIN"
    gatewayParam:
      colorCodeId: 1
      gid: 0
      radioRcvChn: ""
      radioSndChn: ""
      radioPower: 0
      rxCss: ""
      txCss: ""
      width: 0
    item:
      - sn: "20260430200101"
        remark: "批量添加测试1"
        password: ""
      - sn: "20260430200102"
        remark: "批量添加测试2"
        password: ""
    expected:
      code: 0
      error_msg: "成功"

follow_terminal_cases:
  - name: "关注/收藏设备-正向"
    groupId: "{{three_id}}"
    expected:
      code: 0
      error_msg: "成功"
    
  - name: "关注/收藏设备-负向-分组或设备不存在"
    groupId: "12345"
    expected:
      code: 1001
      error_msg: "分组或设备不存在"

move_terminal_cases:
  - name: "移动设备分组-正向"
    groupId: "{{three_id}}"
    newGroupId: "{{one_id}}"
    expected:
      code: 0
      error_msg: "成功"

  - name: "移动设备分组-负向-目标分组不存在"
    groupId: "{{three_id}}"
    newGroupId: "NONEXIST_GROUP_ID"
    expected:
      code: 1001
      error_msg: "分组或设备不存在"

list_terminals_cases:
  - name: "分页获取分组下设备列表-正向"
    groupId: "{{two_id}}"
    addr: ""
    page: 1
    pageSize: 100
    terminalType: ""
    expected:
      code: 0
      error_msg: "成功"

  - name: "分页获取分组下设备列表-负向-缺少Token"
    groupId: "{{two_id}}"
    no_auth: true
    expected:
      code: 3001
      error_msg: "没有访问权限"