# test_xxx.yaml — 简单无状态接口测试数据（模式A）
# 从 api-test-framework Skill 生成
# 对应模板: assets/templates/test_case_simple.tpl.py
# 关键约定:
#   1) 顶层 key 命名与 Python 中 read_yaml(...)[key] 一致（如 xxx_cases）
#   2) 动态依赖值用 {{var_name}} 占位（若存在）
#   3) no_auth: true 用于用例级鉴权开关（模板会按 case.get("no_auth") 决定是否传 auth_headers）
#   4) 正向在前、负向在后

xxx_cases:
  # ==================== 正向用例 ====================
  - name: "登录成功"
    field1: "admin"
    field2: "correct_password"
    expected:
      code: 0
      msg: "成功"

  # ==================== 负向用例 ====================
  - name: "登录失败-密码错误"
    field1: "admin"
    field2: "wrong_password"
    expected:
      code: 1001
      error_msg: "密码错误"

  - name: "登录失败-缺少Token"
    field1: "admin"
    field2: "correct_password"
    no_auth: true              # 模板会不传 auth_headers，验证未授权场景
    expected:
      code: 3001
      error_msg: "没有访问权限"
