# test_xxx.yaml — CRUD测试数据模板（适配模式B′，一类一个 *_cases）
# 从 api-test-framework Skill 生成
#
# 对应模板: assets/templates/test_case_crud.tpl.py
# 关键约定:
#   1) 每个顶层 key 以 _cases 结尾，整段交给一个 Test 类，不要再切片
#   2) 动态依赖值用 {{var_name}} 占位，通过 resolve_extract_value() 从 extract.yaml 读取
#   3) 不在 YAML 内写运行时生成值（如时间戳），由 Python 方法体内组装
#   4) 正向在前、负向在后
#   5) name 给人读（日志/附件），不是 Allure Suites 树标题

create_xxx_cases:
  - name: "创建成功"
    name_field: "资源_{int(time.time())}"
    field2: "固定值"
    expected:
      code: 0
      msg: "成功"

  - name: "创建失败-名称为空"
    name_field: ""
    field2: "固定值"
    expected:
      code: 1001
      error_msg: "名称不能为空"

  - name: "创建失败-名称超长"
    name_field: "这是一个非常非常非常长的名称超出限制长度了..."
    field2: "固定值"
    expected:
      code: 1002
      error_msg: "名称长度不能超过50个字符"

update_xxx_cases:
  - name: "编辑成功"
    id: "{{created_id}}"
    name_field: "编辑_{int(time.time())}"
    expected:
      code: 0
      msg: "成功"

  - name: "编辑失败-资源不存在"
    id: "NONEXIST_RESOURCE_ID"
    name_field: "编辑_非法目标"
    expected:
      code: 1005
      error_msg: "资源不存在"

delete_xxx_cases:
  - name: "删除成功-资源为空"
    id: "{{created_id}}"
    expected:
      code: 0
      msg: "成功"

  - name: "删除失败-资源非空"
    id: "{{one_id}}"
    expected:
      code: 1004
      error_msg: "该资源下存在关联数据，无法删除"

  - name: "删除失败-资源不存在"
    id: "NONEXIST_RESOURCE_ID"
    expected:
      code: 1005
      error_msg: "资源不存在"
